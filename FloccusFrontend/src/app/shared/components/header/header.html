<app-perfil [(visible)]="perfilModalAberta" (perfilAtualizado)="atualizarDadosUsuario($event)" />
<header class="header">

    <div class="header-left">

        <button class="sidebar-toggle desktop-toggle" type="button" (click)="toggleSidebar()"
            [attr.aria-label]="collapsed() ? 'Expandir menu' : 'Recolher menu'">

            <i class="bi bi-list"></i>

        </button>

        <button class="sidebar-toggle mobile-toggle" type="button" (click)="toggleMobileSidebar()"
            aria-label="Abrir menu">

            <i class="bi bi-list"></i>

        </button>

        <div class="header-title">

            <h1>
                Dashboard
            </h1>

            <span>
                Visão geral do sistema
            </span>

        </div>

    </div>


    <div class="header-actions">

        <!-- <button class="header-button" type="button" aria-label="Notificações">
            <i class="bi bi-bell"></i>
        </button> -->


        <div class="account-menu-container">

            <button class="profile" type="button" (click)="toggleAccountMenu()"
                [attr.aria-expanded]="accountMenuOpen()">

                <div class="profile-avatar">
                    {{ usuario?.nome?.[0] }}
                </div>

                <div class="profile-info">

                    <strong>
                        {{ usuario?.nome }}
                    </strong>

                    <span>
                        @if (isAdmin()) {
                        Administrador
                        } @else {
                        Usuário
                        }
                    </span>

                </div>

                <i class="bi bi-chevron-down profile-arrow"></i>

            </button>


            @if (accountMenuOpen()) {

            <div class="account-menu">
                <button type="button" class="account-menu-item" (click)="perfilModalAberta.set(true)">
                    <i class="bi bi-person-circle"></i>
                    Meu perfil
                </button>

                <!-- 
                <button class="account-menu-item" type="button" (click)="abrirConfiguracoes()">

                    <i class="bi bi-gear"></i>
                    <span>Configurações</span>

                </button>


                <button class="account-menu-item" type="button" (click)="abrirContasRecursos()">

                    <i class="bi bi-person-vcard"></i>
                    <span>Contas de recursos</span>

                </button> -->


                <div class="account-menu-divider"></div>


                <button class="account-menu-item logout-item" type="button" (click)="logout()">

                    <i class="bi bi-box-arrow-right"></i>
                    <span>Sair</span>

                </button>

            </div>

            }

        </div>

    </div>

</header>
