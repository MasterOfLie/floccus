@if (loading()) {
<div class="loading-overlay">
    <div class="floccus-loader" aria-hidden="true">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="cloud cloud-4"></div>
    </div>

    @if (text()) {
    <span class="loading-text">
        {{ text() }}
    </span>
    }
</div>
}
