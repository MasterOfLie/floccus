<div class="sidebar-backdrop" [class.visible]="mobileOpen()" (click)="closeMobile()"></div>

<aside class="sidebar" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">

    <!-- LOGO -->

    <div class="sidebar-header">

        <div class="logo">

            @if (collapsed()) {

            <img src="/logo-icon.png" alt="Floccus" class="logo-icon">

            } @else {

            <img src="/logo-color.png" alt="Floccus" class="logo-full">

            }

        </div>

    </div>


    <!-- MENU -->

    <nav class="navigation">

        @for (item of menuItems; track item.route) {

        <a [routerLink]="item.route" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }" class="navigation-item"
            (mouseenter)="showTooltip($event, item.label)" (mouseleave)="hideTooltip()">
            <span class="icon">
                <i [class]="'bi ' + item.icon"></i>
            </span>

            @if (!collapsed()) {
            <span class="label">
                {{ item.label }}
            </span>
            }
        </a>

        }

    </nav>

    @if (tooltipVisible()) {
    <div class="sidebar-tooltip" [style.top.px]="tooltipY()">
        {{ tooltipText() }}
    </div>
    }
</aside>
