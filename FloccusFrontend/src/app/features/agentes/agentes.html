<div class="card-container" [hidden]="loading()">
    <!-- Cabeçalho do Card -->
    <header class="card-header">
        <div class="header-titles">
            <h2>Agentes</h2>
            <p>Gerencie os agentes conectados ao Floccus.</p>
        </div>
        <div class="header-stats">
            <span class="text-muted">Total de Agentes: 12 (1 Ativo)</span>
        </div>
    </header>

    <!-- Barra de Ferramentas -->
    <div class="card-toolbar">
        <div class="toolbar-actions">
            <button class="btn btn-primary" routerLink="/agentes/criar">
                Adicionar Novo Agente
            </button>
        </div>
        <div class="toolbar-filters">
            <div class="search-box">
                <i class="bi bi-search"></i>

                <input type="search" placeholder="Pesquisar agentes..." aria-label="Pesquisar agentes por nome ou IP"
                    [value]="busca()" (input)="alterarBusca($event)" (keyup.enter)="pesquisarAgentes()" />

                @if (busca()) {
                <button type="button" class="btn-clear-search" aria-label="Limpar pesquisa" (click)="limparBusca()">
                    <i class="bi bi-x-lg"></i>
                </button>
                }

                <button type="button" class="btn btn-secondary" (click)="pesquisarAgentes()" [disabled]="carregando()">
                    Buscar
                </button>
            </div>
        </div>

    </div>
    <div class="table-responsive">
        <ng-template #acoesTemplate let-agente>

            <button type="button" class="btn-action" (click)="abrirAgente(agente); $event.stopPropagation()"
                data-tooltip="Visualizar">
                <i class="bi bi-eye"></i>
            </button>

        </ng-template>
        <app-data-table [columns]="colunas" [data]="agentes()" [loading]="carregando()" [paginaAtual]="pagina()"
            [totalPaginas]="totalPaginas()" [totalElementos]="totalElementos()"
            (paginaChange)="alterarPagina($event)" />
    </div>
</div>
