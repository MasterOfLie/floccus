<div class="auth-page">

    <div class="auth-container">

        <!-- LOGO -->
        <div class="auth-logo">
            <img src="/logo-color.png" alt="Floccus">
        </div>

        <!-- CARD -->
        <div class="auth-card">

            <!-- LOGIN -->
            @if (modo === 'login') {

            <div class="auth-header">
                <h1>Bem-vindo de volta</h1>

                <p>
                    Entre na sua conta para continuar
                </p>
            </div>

            <form class="auth-form" (ngSubmit)="login()">

                <!-- E-MAIL -->
                <div class="form-group">

                    <label for="login-email">
                        E-mail
                    </label>

                    <input id="login-email" type="email" name="email" [(ngModel)]="loginData.email"
                        placeholder="seu@email.com" autocomplete="email" required>

                </div>

                <!-- SENHA -->
                <div class="form-group">

                    <div class="label-row">

                        <label for="login-password">
                            Senha
                        </label>

                        <a href="#" class="forgot-password">
                            Esqueceu a senha?
                        </a>

                    </div>

                    <div class="password-input">

                        <input id="login-password" [type]="mostrarSenha ? 'text' : 'password'" name="password"
                            [(ngModel)]="loginData.password" placeholder="••••••••" autocomplete="current-password"
                            required>

                        <button type="button" class="password-toggle" (click)="mostrarSenha = !mostrarSenha">
                            @if (mostrarSenha) {
                            <i class="bi bi-eye-slash"></i>
                            } @else {
                            <i class="bi bi-eye"></i>
                            }
                        </button>

                    </div>

                </div>

                <!-- LEMBRAR -->
                <label class="remember">

                    <input type="checkbox" name="remember" [(ngModel)]="loginData.remember">

                    <span>
                        Lembrar de mim
                    </span>

                </label>

                <!-- BOTÃO -->
                <button type="submit" class="submit-button">
                    Entrar
                </button>

            </form>

            <!-- RODAPÉ -->
            <div class="auth-footer">

                <span>
                    Ainda não possui uma conta?
                </span>

                <button type="button" (click)="alterarModo('registro')">
                    Criar conta
                </button>

            </div>

            }

            <!-- REGISTRO -->
            @if (modo === 'registro') {

            <div class="auth-header">

                <h1>Crie sua conta</h1>

                <p>
                    Comece a utilizar o Floccus
                </p>

            </div>

            <form class="auth-form" (ngSubmit)="registrar()">

                <!-- NOME -->
                <div class="form-group">

                    <label for="register-name">
                        Nome
                    </label>

                    <input id="register-name" type="text" name="name" [(ngModel)]="registroData.name"
                        placeholder="Seu nome" autocomplete="name" required>

                </div>

                <!-- E-MAIL -->
                <div class="form-group">

                    <label for="register-email">
                        E-mail
                    </label>

                    <input id="register-email" type="email" name="registerEmail" [(ngModel)]="registroData.email"
                        placeholder="seu@email.com" autocomplete="email" required>

                </div>

                <!-- SENHA -->
                <div class="form-group">

                    <label for="register-password">
                        Senha
                    </label>

                    <input id="register-password" type="password" name="registerPassword"
                        [(ngModel)]="registroData.password" placeholder="••••••••" autocomplete="new-password" required>

                </div>

                <!-- CONFIRMAR SENHA -->
                <div class="form-group">

                    <label for="register-confirm-password">
                        Confirmar senha
                    </label>

                    <input id="register-confirm-password" type="password" name="confirmPassword"
                        [(ngModel)]="registroData.confirmPassword" placeholder="••••••••" autocomplete="new-password"
                        required>

                </div>

                <!-- TERMOS -->
                <label class="remember">

                    <input type="checkbox" name="terms" [(ngModel)]="registroData.terms" required>

                    <span>
                        Aceito os termos de uso
                    </span>

                </label>

                <!-- BOTÃO -->
                <button type="submit" class="submit-button">
                    Criar conta
                </button>

            </form>

            <!-- RODAPÉ -->
            <div class="auth-footer">

                <span>
                    Já possui uma conta?
                </span>

                <button type="button" (click)="alterarModo('login')">
                    Entrar
                </button>

            </div>

            }

        </div>

        <!-- COPYRIGHT -->
        <div class="auth-copyright">
            © {{ anoAtual }} Floccus. Todos os direitos reservados.
        </div>

    </div>

</div>
