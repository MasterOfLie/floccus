<div class="page">

  <ng-template #statusTemplate let-container>

    <span class="status" [class.running]="estaRodando(container.status)"
      [class.exited]="!estaRodando(container.status)">

      <span class="status-dot"></span>

      {{ traduzirStatus(container.status) }}

    </span>

  </ng-template>

  <ng-template #acoesTemplate let-container>

    <button type="button" class="btn-abrir" (click)="abrirContainer(container); $event.stopPropagation()">
      Abrir
    </button>

  </ng-template>
  <ng-template #memoriaTemplate let-aplicacao>
    {{ formatarMemoria(aplicacao.memoriaLimite) }}
  </ng-template>

  <div class="page-header">

    <button type="button" class="btn-acao" (click)="listarContainers()" [disabled]="carregando()">

      ↻ Recarregar

    </button>

  </div>

  <app-data-table [columns]="colunas" [data]="aplicacoes()" [loading]="carregando()" [paginaAtual]="pagina()"
    [totalPaginas]="totalPaginas()" [totalElementos]="totalElementos()" (paginaChange)="alterarPagina($event)" />

</div>
