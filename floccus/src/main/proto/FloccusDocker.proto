syntax = "proto3";

option java_multiple_files = true;
option java_package = "br.dev.matheushenrique.grpc";

package floccus;

service AgenteDockerService {
  rpc ListarContainers (ListarContainersRequest) returns (ListarContainersResponse);
  rpc IniciarContainer (ContainerRequest) returns (ContainerResponse);
  rpc PararContainer (ContainerRequest) returns (ContainerResponse);
  rpc ReiniciarContainer (ContainerRequest) returns (ContainerResponse);
  rpc DetalharContainer (ContainerRequest) returns (ContainerResponse);
  rpc StreamarLogsContainer (LogsContainerRequest) returns (stream LogContainer);
}

message ContainerModel {
  string id = 1;
  string nome = 2;
  string imagem = 3;
  string status = 4;
  repeated FloccusNetwork redes = 6;
  string memoria = 7;
  string cpu = 8;
  string diretorio = 9;
  string tempo_status = 10;
}

message FloccusNetwork {
  string nome = 1;
  string id = 2;
  string ip = 3;
  string gateway = 4;
  string mac = 5;
}

message ListarContainersRequest {
  bool mostrar_todos = 1;
}

message ListarContainersResponse {
  repeated ContainerModel containers = 1;
}

message ContainerRequest {
  string id = 1;
}

message ContainerResponse {
  ContainerModel container = 1;
}

// PROTO LOGS
message LogsContainerRequest {
  string id = 1;
  int32 linhas = 2;
}
enum TipoLog {
  LOG_DESCONHECIDO = 0;
  STDOUT = 1;
  STDERR = 2;
}
message LogContainer {
  string id = 1;
  string mensagem = 2;
  TipoLog tipo = 3;
  int64 timestamp = 4;
}